<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="PhungHieu AR Experience - trải nghiệm thực tế tăng cường với hình ảnh mục tiêu PhungHieu.">
  <meta name="theme-color" content="#0b1020">
  <title>PhungHieu AR Experience</title>
  <style>
    body { margin:0; overflow:hidden; background:radial-gradient(circle at top,#101827,#070b12 55%); font-family:Arial,sans-serif; }
    .ui-hint {
      position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
      padding:12px 18px; border-radius:999px; background:rgba(12,18,30,.72);
      color:#f5f7ff; border:1px solid rgba(255,255,255,.12); font-size:14px;
      letter-spacing:.04em; text-align:center; backdrop-filter:blur(8px);
      box-shadow:0 10px 30px rgba(0,0,0,.28); z-index:10; pointer-events:none;
    }
    .ui-hint strong { font-weight:700; }
    
    a-scene { position:relative; z-index:1; }

    /* YouTube Popup Styles */
    #youtube-modal {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85); z-index: 100000; align-items: center; justify-content: center;
    }
    #youtube-modal.active { display: flex; }
    .youtube-container { position: relative; width: 90%; max-width: 800px; aspect-ratio: 16 / 9; }
    .youtube-container iframe {
      width: 100%; height: 100%; border: none; border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    #close-youtube {
      position: absolute; top: -45px; right: 0; color: white; font-size: 36px;
      cursor: pointer; background: none; border: none; padding: 0; line-height: 1;
    }
  </style>

  <script crossorigin="anonymous" src="./external/scripts/8frame-1.5.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js" crossorigin="anonymous"></script>
  
  <script>
    // A-Frame component to trigger YouTube popup when image is scanned
    AFRAME.registerComponent('youtube-trigger', {
      init: function() {
        const modal = document.getElementById('youtube-modal');
        const iframe = document.getElementById('youtube-iframe');
        const closeBtn = document.getElementById('close-youtube');
        const videoUrl = 'https://www.youtube.com/embed/uBd3Us7C_nU?autoplay=1';

        this.el.addEventListener('xrimagefound', () => {
          if (!modal.classList.contains('active')) {
            iframe.src = videoUrl;
            modal.classList.add('active');
          }
        });
        
        closeBtn.addEventListener('click', () => {
          modal.classList.remove('active');
          iframe.src = ''; // Clear src to stop video playback
        });
      }
    });
  </script>
</head>
<body>
  <script src="bundle.js"></script>
  
  <div class="ui-hint"><strong>PhungHieu AR</strong> · Quét hình ảnh để xem trải nghiệm</div>

  <!-- YouTube Modal -->
  <div id="youtube-modal">
    <div class="youtube-container">
      <button id="close-youtube">&times;</button>
      <iframe id="youtube-iframe" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
  </div>

  <a-scene xrextras-gesture-detector landing-page xrextras-loading xrextras-runtime-error renderer="colorManagement:true" xrweb="disableWorldTracking: true">
    <a-assets>
      <img id="phunghieu-thumb" src="assets/PhungHieu.png">
    </a-assets>
    
    <a-camera position="0 4 10" raycaster="objects: .cantap" cursor="fuse: false; rayOrigin: mouse;"></a-camera>
    <a-light type="directional" intensity="0.5" position="1 1 1"></a-light>
    <a-light type="ambient" intensity="1"></a-light>
    
    <!-- Using the youtube-trigger component -->
    <xrextras-named-image-target name="PhungHieu" youtube-trigger>
      <a-image src="#phunghieu-thumb" width="1.4" height="1"></a-image>
    </xrextras-named-image-target>
  </a-scene>
</body>
</html>
