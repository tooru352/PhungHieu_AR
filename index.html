<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="description" content="PhungHieu AR Experience - trải nghiệm thực tế tăng cường với hình ảnh mục tiêu PhungHieu."><meta name="theme-color" content="#0b1020"><title>PhungHieu AR Experience</title><style>body{margin:0;overflow:hidden;background:radial-gradient(circle at top,#101827,#070b12 55%);font-family:Arial,sans-serif}.ui-hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);padding:12px 18px;border-radius:999px;background:rgba(12,18,30,.72);color:#f5f7ff;border:1px solid rgba(255,255,255,.12);font-size:14px;letter-spacing:.04em;text-align:center;backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(0,0,0,.28);z-index:10;pointer-events:none}.ui-hint strong{font-weight:700}#play-video-btn{position:fixed;right:18px;bottom:18px;z-index:99999;padding:12px 18px;border:none;border-radius:999px;background:#ff7a18;color:#fff;font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(255,122,24,.35);cursor:pointer}.#play-video-btn:active{transform:translateY(1px)}#play-video-overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,12,20,.72);z-index:99998;opacity:0;transition:opacity .2s ease}.#play-video-overlay.visible{display:flex;opacity:1}#play-video-overlay video{display:block;width:min(86vw,560px);max-height:72vh;border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.4);background:#000}a-scene{position:relative;z-index:1}</style><script crossorigin="anonymous" src="./external/scripts/8frame-1.5.0.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script><script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js" crossorigin="anonymous"></script><script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js" crossorigin="anonymous"></script></head><body><script src="bundle.js"></script><div class="ui-hint"><strong>PhungHieu AR</strong> · Quét hình ảnh để xem trải nghiệm</div><button id="play-video-btn" type="button">Play Video</button><div id="play-video-overlay" aria-label="Video overlay"><video id="phunghieu-video" autoplay muted loop crossorigin="anonymous" playsinline webkit-playsinline preload="auto" controls src="assets/PhungHieu.mp4"></video></div><a-scene xrextras-gesture-detector landing-page xrextras-loading xrextras-runtime-error renderer="colorManagement:true" xrweb="disableWorldTracking: true"><a-assets><img id="phunghieu-thumb" src="assets/PhungHieu.png"></a-assets><a-camera position="0 4 10" raycaster="objects: .cantap" cursor="fuse: false; rayOrigin: mouse;"></a-camera><a-light type="directional" intensity="0.5" position="1 1 1"></a-light><a-light type="ambient" intensity="1"></a-light><xrextras-named-image-target name="PhungHieu"><a-entity xrextras-play-video="video: #phunghieu-video; thumb: #phunghieu-thumb; canstop: true" geometry="primitive: plane; width: 1.4; height: 1;"></a-entity></xrextras-named-image-target></a-scene><script>document.addEventListener('DOMContentLoaded', function(){var v=document.getElementById('phunghieu-video');var btn=document.getElementById('play-video-btn');var overlay=document.getElementById('play-video-overlay');if(v){v.muted=true;v.playsInline=true;v.setAttribute('playsinline','true');v.setAttribute('webkit-playsinline','true');v.preload='auto';v.pause();v.style.display='block';}if(btn&&overlay){btn.addEventListener('click', function(){overlay.style.display='flex';overlay.classList.add('visible');if(v){v.muted=false;v.currentTime=0;v.play().catch(function(){})}});overlay.addEventListener('click', function(e){if(e.target===overlay){overlay.classList.remove('visible');overlay.style.display='none';if(v){v.pause();}}});}});</script></body></html>
